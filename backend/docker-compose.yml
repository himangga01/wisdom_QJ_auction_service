# 레거시 백엔드 개발용 구성입니다.
# 전체 서비스는 저장소 루트의 docker-compose.production.yml을 사용하세요.
# Legacy backend-only development compose. Use ../docker-compose.production.yml for the full service.

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  worker:
    build: .
    command: celery -A app.tasks.crawl_tasks.celery_app worker --loglevel=info --concurrency=1
    env_file: .env
    depends_on: [postgres, redis]
  scheduler:
    build: .
    command: celery -A app.tasks.crawl_tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wisdom_auction
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]

volumes:
  postgres_data:
  redis_data:
