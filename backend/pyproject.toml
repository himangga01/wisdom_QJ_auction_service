[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wisdom-qj-auction-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<6",
  "playwright>=1.49,<2",
  "openpyxl>=3.1,<4",
  "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "live_naver: opt-in sampled Naver Land live comparison",
  "live_naver_full: opt-in exhaustive Naver Land live comparison",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
